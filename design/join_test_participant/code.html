<body class="bg-[#FAFAFA] min-h-screen flex items-center justify-center p-container-padding text-on-surface">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-8 flex flex-col gap-6 shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-4 border-b border-outline-variant pb-6">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">quiz</span>
</div>
<div>
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg font-display-lg-mobile text-display-lg-mobile mb-2">Join Test</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the test token provided by your teacher or test administrator.</p>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<div class="flex flex-col gap-2 relative group">
<label class="font-body-sm text-body-sm font-medium text-on-surface" for="testToken">Test Token</label>
<div class="relative">
<input aria-describedby="tokenHelp" class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-mono-label text-mono-label placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all uppercase" id="testToken" placeholder="e.g. UGR-20260824-X8K2" type="text"/>
<!-- Example of error state (hidden by default, can be toggled with JS) -->
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-error hidden" id="errorIcon">error</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-[12px] h-4" id="tokenHelp">
<span class="text-error hidden" id="errorText">Invalid token format. Please check and try again.</span>
</p>
</div>
<!-- Actions -->
<button class="w-full h-12 bg-primary-container text-on-primary font-title-sm text-title-sm rounded-lg hover:bg-primary transition-colors flex items-center justify-center gap-2" type="button">
                Continue
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="text-center mt-2">
<a class="font-body-sm text-body-sm text-primary-container hover:text-primary transition-colors" href="#">I need help joining</a>
</div>
