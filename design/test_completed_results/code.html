<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Test Completed - TestFlow Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#e2dfff",

                        "error-container": "#ffdad6",

                        "surface-container-low": "#f0f3ff",
                        "primary-container": "#4f46e5",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-bright": "#f9f9ff",
                        "background": "#f9f9ff",
                        "on-secondary-fixed-variant": "#404758",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#d9dff5",
                        "tertiary-container": "#a44100",
                        "on-primary-container": "#dad7ff",
                        "tertiary": "#7e3000",
                        "secondary": "#575e70",
                        "inverse-primary": "#c3c0ff",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2a313d",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "on-primary-fixed-variant": "#3323cc",
                        "outline-variant": "#c7c4d8",
                        "secondary-fixed": "#dce2f7",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-primary-fixed": "#0f0069",
                        "secondary-fixed-dim": "#c0c6db",
                        "on-surface-variant": "#464555",
                        "primary": "#3525cd",
                        "on-tertiary-fixed": "#351000",
                        "on-background": "#151c27",
                        "surface-container-high": "#e2e8f8",
                        "surface": "#f9f9ff",
                        "outline": "#777587",
                        "surface-dim": "#d3daea",
                        "on-secondary-fixed": "#141b2b",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-variant": "#dce2f3",
                        "surface-container": "#e7eefe",
                        "surface-container-highest": "#dce2f3",
                        "on-tertiary-container": "#ffd2be",
                        "on-secondary-container": "#5c6274"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "section-gap": "48px",
                        "base": "4px",
                        "gutter": "24px",
                        "container-padding": "32px",
                        "sidebar-collapsed": "72px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "mono-label": ["jetbrainsMono"],
                        "body-sm": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "title-sm": ["Inter"],

                        "body-md": ["Inter"]

                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background h-full flex flex-col items-center justify-center p-4">
<!-- Suppressed SideNavBar and TopNavBar as this is a linear/transactional success screen -->
<main class="w-full max-w-2xl mx-auto">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-10 flex flex-col items-center text-center shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-colors duration-200 hover:border-outline">
<!-- Success Icon -->
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary-container" style="font-size: 40px; font-variation-settings: 'FILL' 0;">
                    check_circle
                </span>
</div>
<!-- Title & Message -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Test Completed</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-10">Your answers have been submitted successfully.</p>
<!-- Results Data (Bento style grid) -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full mb-8">
<!-- Score Card -->
<div class="bg-surface-bright border border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center sm:col-span-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-2">Final Score</span>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-primary-container">90</span>
<span class="font-title-sm text-title-sm text-on-surface-variant">/ 100</span>
</div>
</div>
<!-- Stats Card -->
<div class="bg-surface-bright border border-outline-variant rounded-lg p-5 flex flex-col items-start text-left">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-4">Performance</span>
<ul class="space-y-3 w-full">
<li class="flex justify-between items-center w-full">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#10B981]"></span>
<span class="font-body-sm text-body-sm text-on-surface">Correct</span>
</div>
<span class="font-mono-label text-mono-label text-on-surface-variant">18</span>
</li>
<li class="flex justify-between items-center w-full">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-body-sm text-body-sm text-on-surface">Wrong</span>
</div>
<span class="font-mono-label text-mono-label text-on-surface-variant">2</span>
</li>
<li class="flex justify-between items-center w-full">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-outline"></span>
<span class="font-body-sm text-body-sm text-on-surface">Unanswered</span>
</div>
<span class="font-mono-label text-mono-label text-on-surface-variant">0</span>
</li>
</ul>
</div>
<!-- Time Card -->
<div class="bg-surface-bright border border-outline-variant rounded-lg p-5 flex flex-col items-start text-left">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-4">Duration</span>
<div class="flex items-center gap-3 mt-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">schedule</span>
<div>
<span class="font-title-sm text-title-sm text-on-surface block">42 minutes</span>
<span class="font-body-sm text-body-sm text-on-surface-variant block">Completion time</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="px-6 py-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface font-title-sm text-title-sm hover:bg-surface-container-low transition-colors duration-200">
                    Review Answers
                </button>
<button class="px-6 py-3 rounded-lg bg-primary-container text-on-primary font-title-sm text-title-sm hover:opacity-90 transition-opacity duration-200">
                    Return to Dashboard
                </button>
</div>
</div>
</main>
</body></html>
