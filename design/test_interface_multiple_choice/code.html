</div>

</div>

</div>
<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface-container px-3 py-1 rounded-md">5 points</span>

</label>

<label class="flex items-center p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">

</label>

<button class="w-full aspect-square rounded-lg border border-outline-variant bg-surface-container-lowest flex items-center justify-center font-mono-label text-mono-label text-on-surface hover:border-primary-container hover:bg-surface transition-colors">7</button>
